version: 2
updates:
  # NuGet updates require packages.lock.json to stay in step; Dependabot
  # regenerates it as part of the pull request.
  - package-ecosystem: nuget
    directory: /src/SoldierSave.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies

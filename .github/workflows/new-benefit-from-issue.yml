name: Create PR from new benefit issue

on:
  issues:
    types: [opened, labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: new-benefit-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  create-pr-from-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Apply benefit from issue to benefits.json
        id: apply-benefit
        uses: actions/github-script@v7
        with:
          script: |
            const { applyIssue } = require('./.github/scripts/benefit-import.cjs');
            await applyIssue({ github, context, core });

      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so validate.yml
      # never runs on a community contribution. Validate here instead, before the PR
      # exists, so a malformed submission cannot reach main unchecked.
      - name: Setup Python
        if: ${{ steps.apply-benefit.outputs.benefit-id != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate catalog
        if: ${{ steps.apply-benefit.outputs.benefit-id != '' }}
        run: |
          python -m pip install -r .github/scripts/requirements.txt
          python .github/scripts/validate_catalog.py

      - name: Create pull request
        if: ${{ steps.apply-benefit.outputs.benefit-id != '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: data/benefits.json
          commit-message: "Add benefit from issue #${{ github.event.issue.number }}"
          title: "Add benefit: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          body: |
            This pull request was generated automatically from issue #${{ github.event.issue.number }}.

            - Benefit added by: @${{ github.event.issue.user.login }}
            - Source: issue #${{ github.event.issue.number }}
          branch: "new-benefit/issue-${{ github.event.issue.number }}"
          labels: "type:new-benefit,area:data"
          delete-branch: true

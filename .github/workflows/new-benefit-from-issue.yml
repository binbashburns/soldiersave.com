name: Create PR from new benefit issue

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr-from-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply benefit from issue to benefits.json
        id: apply-benefit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const issueNumber = issue.number;

            // Fetch the latest labels from the GitHub API so this also works
            // when jobs are re-run and the original payload is stale.
            const { owner, repo } = context.repo;
            const latest = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });

            const labels = latest.data.labels || [];
            const labelNames = labels.map(l => typeof l === 'string' ? l : l.name);
            core.info(`Issue #${issueNumber} labels: ${labelNames.join(', ')}`);

            const hasNewBenefitLabel = labelNames.includes('type:new-benefit');

            // Only proceed for issues that are explicitly labeled type:new-benefit
            if (!hasNewBenefitLabel) {
              core.info('Issue does not have type:new-benefit label. Skipping benefit import.');
              core.setOutput('benefit-id', '');
              return;
            }

            const body = latest.data.body || '';

            function getSection(label) {
              const pattern = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n### |$)`, 'm');
              const match = body.match(pattern);
              return match ? match[1].trim() : '';
            }

            const name = getSection('Benefit name');
            const primaryUrl = getSection('Primary URL');
            const extraUrlsRaw = getSection('Additional URLs \\(optional\\)');
            const summary = getSection('Short description');
            const tagsRaw = getSection('Tags');
            const categoriesRaw = getSection('Category \\(pick one that fits best\\)');
            const eligibilityRaw = getSection('Who is eligible\\? \\(check all that apply\\)');

            if (!name || !primaryUrl) {
              core.setFailed('Benefit name and Primary URL are required from the issue form.');
              return;
            }

            const extraUrls = extraUrlsRaw
              .split('\n')
              .map(l => l.trim())
              .filter(l => l.length > 0);

            const urls = [primaryUrl, ...extraUrls];

            const tags = new Set(
              tagsRaw
                .split(',')
                .map(t => t.trim())
                .filter(t => t.length > 0)
            );

            categoriesRaw
              .split(',')
              .map(c => c.trim())
              .filter(c => c.length > 0)
              .forEach(c => tags.add(c));

            const eligibility = eligibilityRaw
              .split('\n')
              .map(l => l.replace(/^[-*]\s*/, '').trim())
              .filter(l => l.length > 0);

            function slugify(text) {
              return text
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '') || 'benefit';
            }

            const benefitsPath = path.join(process.cwd(), 'data', 'benefits.json');
            const wwwrootPath = path.join(process.cwd(), 'src', 'SoldierSave.Web', 'wwwroot', 'data', 'benefits.json');

            const benefits = JSON.parse(fs.readFileSync(benefitsPath, 'utf8'));

            const usedIds = new Set(benefits.map(b => b.id).filter(Boolean));

            function assignId(name) {
              const base = slugify(name);
              if (!usedIds.has(base)) {
                usedIds.add(base);
                return base;
              }
              let i = 2;
              while (usedIds.has(`${base}-${i}`)) {
                i++;
              }
              const finalId = `${base}-${i}`;
              usedIds.add(finalId);
              return finalId;
            }

            const id = assignId(name);
            const nowIso = new Date().toISOString();

            const newBenefit = {
              id,
              name,
              url: primaryUrl,
              urls,
              summary,
              categories: [], // categories are expressed as tags for the UI
              tags: Array.from(tags),
              eligibility,
              source: {
                type: 'community',
                reference: `issue-${issue.number}`
              },
              addedBy: `@${issue.user.login}`,
              addedAt: nowIso
            };

            benefits.push(newBenefit);

            const payload = JSON.stringify(benefits, null, 2);
            fs.writeFileSync(benefitsPath, payload, 'utf8');
            fs.mkdirSync(path.dirname(wwwrootPath), { recursive: true });
            fs.writeFileSync(wwwrootPath, payload, 'utf8');

            core.setOutput('benefit-id', id);

      - name: Create pull request
        if: ${{ steps.apply-benefit.outputs.benefit-id != '' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add benefit from issue #${{ github.event.issue.number }}"
          title: "Add benefit: #${{ github.event.issue.number }} - ${{ github.event.issue.title }}"
          body: |
            This pull request was generated automatically from issue #${{ github.event.issue.number }}.

            - Benefit added by: @${{ github.event.issue.user.login }}
            - Source: issue #${{ github.event.issue.number }}
          branch: "new-benefit/issue-${{ github.event.issue.number }}"
          labels: "type:new-benefit,area:data"
          delete-branch: true

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages cannot send response headers, so the policy has to be delivered
         as a meta tag. Note that frame-ancestors and X-Content-Type-Options are
         header-only and are therefore not enforceable here.
         'wasm-unsafe-eval' is required by the .NET WebAssembly runtime; the favicon
         is an inline SVG data: URI, which is why img-src allows data:. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   base-uri 'self';
                   object-src 'none';
                   script-src 'self' 'wasm-unsafe-eval';
                   style-src 'self';
                   img-src 'self' data:;
                   font-src 'self';
                   connect-src 'self';
                   form-action 'none';
                   frame-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>SoldierSave.com</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='50%25' y='60%25' font-size='44' text-anchor='middle'%3E%F0%9F%AA%96%3C/text%3E%3C/svg%3E" />
    <link href="SoldierSave.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
